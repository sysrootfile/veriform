services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD zorunlu — .env dosyasında gerçek bir değer ver}
      POSTGRES_DB: veriform
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Şema initdb mount'uyla değil, panel açılışındaki migration koşucusuyla kurulur/güncellenir
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d veriform"]
      interval: 3s
      timeout: 3s
      retries: 20

  panel:
    build:
      context: .
      args:
        # Self-servis /tarama için apk chromium dahil (imaj büyür)
        WITH_SCANNER: "1"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/veriform
      # Mail bağlantılarının ve embed adresinin kökü — Postgres modunda zorunlu
      PANEL_URL: "${PANEL_URL:?PANEL_URL zorunludur (örn. https://panel.veriform.io)}"
      PORT: "4620"
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET zorunlu — openssl rand -hex 32 ile üret}
      # TLS sonlandıran proxy arkasında 1 yap; düz HTTP'de Secure çerez oturumu düşürür
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-0}
      # Rotasyon penceresinde eski anahtarı taşır; boşsa eski çerezler düşer
      SESSION_SECRET_PREVIOUS: ${SESSION_SECRET_PREVIOUS:-}
      WORKER_TOKEN: ${WORKER_TOKEN:-}
      # Operatör konsolu: owner e-postası bu virgül-listesinde olan kiracılar /operator/* görür
      OPERATOR_EMAILS: ${OPERATOR_EMAILS:-}
      # Mail yolu: https PANEL_URL'de SMTP_HOST zorunlu, tanımsızsa açılış durur
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Yalnız yerel deneme: https panelde mail console'a düşse de açılır
      ALLOW_CONSOLE_MAIL: ${ALLOW_CONSOLE_MAIL:-}
      # İletişim formu taleplerinin gideceği adres; boşsa kod varsayılanını kullanır
      CONTACT_OPERATOR_EMAIL: ${CONTACT_OPERATOR_EMAIL:-}
      ENABLE_SCAN_SCHEDULER: "1"
      SCAN_CHECK_INTERVAL_MS: "300000"
      CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium-browser
    ports:
      - "4620:4620"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
